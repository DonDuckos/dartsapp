name: Darts Profile Agent

on:
  schedule:
    # Einmal wöchentlich, Montag 06:00 UTC — Vitas/Fotos ändern sich selten,
    # und der Agent überspringt ohnehin bereits befüllte Spieler/Events.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  update-profiles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/profile-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: node index.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
