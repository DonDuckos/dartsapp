name: dartsapp
description: "Open-source Flutter reference implementation from early OchePulse development, focused on live sports data and bounded AI-assisted automation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.5.0
  intl: ^0.20.3
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
